<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援士クエスト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 24px 0;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    padding: 28px;
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    box-sizing: border-box;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #0f172a;
    font-weight: bold;
    font-size: 16px;
    margin-top: 8px;
  }
  button.secondary {
    background: transparent;
    border: 1px solid #22c55e;
    color: #22c55e;
  }
  #message {
    margin-top: 16px;
    text-align: center;
    font-size: 14px;
    color: #fbbf24;
  }
  #welcome {
    display: none;
  }
  #quizArea {
    display: none;
  }

  /* --- クイズ画面用スタイル --- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    color: #94a3b8;
  }
  .top-bar button {
    width: auto;
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 0;
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
  }
  .tag {
    display: inline-block;
    background: #334155;
    color: #93c5fd;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    margin-bottom: 12px;
  }
  .question-body {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    box-sizing: border-box;
  }
  .choice.selected {
    border-color: #22c55e;
    background: #14532d;
  }
  .choice.correct {
    border-color: #22c55e;
    background: #14532d;
    font-weight: bold;
  }
  .choice.incorrect {
    border-color: #ef4444;
    background: #450a0a;
  }
  .result-box {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: 10px;
    background: #0f172a;
  }
  .result-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .result-title.correct-text { color: #4ade80; }
  .result-title.incorrect-text { color: #f87171; }
  .exp-gain {
    font-size: 13px;
    color: #fbbf24;
    margin-bottom: 12px;
  }
  .explanation {
    font-size: 13px;
    line-height: 1.6;
    color: #cbd5e1;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🛡️ 支援士クエスト</h1>

  <!-- ログインフォーム -->
  <div id="authForm">
    <input type="email" id="email" placeholder="メールアドレス">
    <input type="password" id="password" placeholder="パスワード(6文字以上)">
    <button onclick="signUp()">新規登録</button>
    <button class="secondary" onclick="signIn()">ログイン</button>
    <div id="message"></div>
  </div>

  <!-- ログイン後のクイズ画面 -->
  <div id="quizArea">
    <div class="top-bar">
      <span id="userLabel"></span>
      <button onclick="signOut()">ログアウト</button>
    </div>

    <div id="quizContent"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gmtfzlfxswzkwqxnldpw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MjnrZuoAiuyTy5uu1f1tpg_zcgdHLEJ";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ==========================================
  // ダミー問題データ(あとでSupabaseから取得する形に差し替え予定)
  // ==========================================
  const dummyQuestions = [
    {
      id: "dummy1",
      field: "Webセキュリティ",
      body: "Webアプリケーションに対するクロスサイトスクリプティング(XSS)攻撃への対策として、最も適切なものはどれか。",
      choices: {
        "ア": "SQL文の組み立てにバインド機構を使用する",
        "イ": "HTTPレスポンスヘッダにContent-Security-Policyを設定する",
        "ウ": "パスワードをハッシュ化して保存する",
        "エ": "セッションIDを推測困難な乱数で生成する"
      },
      answer: "イ",
      explanation: "Content-Security-Policy(CSP)は、ブラウザが読み込み・実行できるリソースを制限するHTTPレスポンスヘッダであり、XSS攻撃による不正スクリプトの実行を防ぐ有効な対策です。\n\nア:SQLインジェクション対策です。\nウ:パスワード漏えい時の被害軽減策であり、XSS対策ではありません。\nエ:セッションハイジャック対策であり、XSS自体を防ぐものではありません。"
    },
    {
      id: "dummy2",
      field: "暗号技術",
      body: "公開鍵暗号方式に関する記述のうち、適切なものはどれか。",
      choices: {
        "ア": "暗号化と復号に同じ鍵を使用する",
        "イ": "鍵の配送に安全な経路が必須である",
        "ウ": "公開鍵で暗号化したデータは、対応する秘密鍵でのみ復号できる",
        "エ": "共通鍵暗号方式より暗号化・復号の処理速度が速い"
      },
      answer: "ウ",
      explanation: "公開鍵暗号方式では、公開鍵で暗号化したデータは、対になる秘密鍵でのみ復号可能です。これにより、鍵配送問題を解決できます。\n\nア・イ:共通鍵暗号方式の特徴です。\nエ:公開鍵暗号方式は一般的に共通鍵暗号方式より処理が低速です。"
    },
    {
      id: "dummy3",
      field: "ネットワークセキュリティ",
      body: "ファイアウォールにおけるステートフルインスペクション方式の特徴として、適切なものはどれか。",
      choices: {
        "ア": "パケットのヘッダ情報だけで許可・拒否を判定する",
        "イ": "通信の状態(セッション)を管理し、一連の通信の文脈を踏まえて判定する",
        "ウ": "アプリケーション層のデータ内容を検査対象としない",
        "エ": "暗号化通信の中身を必ず復号して検査する"
      },
      answer: "イ",
      explanation: "ステートフルインスペクションは、通信の状態(セッション情報)を保持・管理し、一連の通信の文脈(戻りのパケットかどうかなど)を踏まえて許可・拒否を判定する方式です。\n\nア:単純なパケットフィルタリング方式の説明です。\nエ:暗号化通信の復号は別の技術(SSLインスペクションなど)であり、ステートフルインスペクションの必須要件ではありません。"
    }
  ];

  let currentIndex = 0;
  let answered = false;

  function showMessage(text) {
    document.getElementById('message').innerText = text;
  }

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) {
      showMessage("登録エラー: " + error.message);
    } else {
      showMessage("登録成功!そのままログインしてください。");
    }
  }

  async function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showMessage("ログインエラー: " + error.message);
    } else {
      checkUser();
    }
  }

  async function signOut() {
    await sb.auth.signOut();
    checkUser();
  }

  async function checkUser() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('quizArea').style.display = 'block';
      document.getElementById('userLabel').innerText = user.email;
      currentIndex = 0;
      renderQuestion();
    } else {
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('quizArea').style.display = 'none';
      showMessage("");
    }
  }

  function renderQuestion() {
    answered = false;
    const q = dummyQuestions[currentIndex];
    const container = document.getElementById('quizContent');

    let choicesHtml = "";
    for (const key in q.choices) {
      choicesHtml += `<button class="choice" onclick="selectChoice('${key}')" id="choice-${key}">${key}. ${q.choices[key]}</button>`;
    }

    container.innerHTML = `
      <div class="tag">${q.field}</div>
      <div class="question-body">${q.body}</div>
      <div id="choicesArea">${choicesHtml}</div>
      <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle"></div>
        <div class="exp-gain" id="expGain"></div>
        <div class="explanation" id="explanationText"></div>
        <button onclick="nextQuestion()" style="margin-top:16px;">次の問題へ</button>
      </div>
    `;
  }

  function selectChoice(key) {
    if (answered) return;
    answered = true;

    const q = dummyQuestions[currentIndex];
    const isCorrect = (key === q.answer);

    // 選択肢の見た目を更新
    for (const k in q.choices) {
      const btn = document.getElementById('choice-' + k);
      btn.disabled = true;
      if (k === q.answer) {
        btn.classList.add('correct');
      } else if (k === key) {
        btn.classList.add('incorrect');
      }
    }

    // 結果表示
    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const expGain = document.getElementById('expGain');
    const explanationText = document.getElementById('explanationText');

    if (isCorrect) {
      resultTitle.innerText = "✅ 正解!";
      resultTitle.className = "result-title correct-text";
      expGain.innerText = "+10 EXP";
    } else {
      resultTitle.innerText = "❌ 不正解";
      resultTitle.className = "result-title incorrect-text";
      expGain.innerText = "+2 EXP(正解は " + q.answer + ")";
    }

    explanationText.innerText = q.explanation;
    resultBox.style.display = "block";
  }

  function nextQuestion() {
    currentIndex = (currentIndex + 1) % dummyQuestions.length;
    renderQuestion();
  }

  checkUser();
</script>

</body>
</html>
