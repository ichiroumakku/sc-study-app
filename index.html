<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援士クエスト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 24px 0;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    padding: 28px;
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    box-sizing: border-box;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #0f172a;
    font-weight: bold;
    font-size: 16px;
    margin-top: 8px;
  }
  button.secondary {
    background: transparent;
    border: 1px solid #22c55e;
    color: #22c55e;
  }
  #message {
    margin-top: 16px;
    text-align: center;
    font-size: 14px;
    color: #fbbf24;
  }
  #quizArea {
    display: none;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    color: #94a3b8;
  }
  .top-bar button {
    width: auto;
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 0;
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
  }
  .tag {
    display: inline-block;
    background: #334155;
    color: #93c5fd;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    margin-bottom: 12px;
  }
  .question-body {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    box-sizing: border-box;
  }
  .choice.correct {
    border-color: #22c55e;
    background: #14532d;
    font-weight: bold;
  }
  .choice.incorrect {
    border-color: #ef4444;
    background: #450a0a;
  }
  .result-box {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: 10px;
    background: #0f172a;
  }
  .result-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .result-title.correct-text { color: #4ade80; }
  .result-title.incorrect-text { color: #f87171; }
  .exp-gain {
    font-size: 13px;
    color: #fbbf24;
    margin-bottom: 12px;
  }
  .explanation {
    font-size: 13px;
    line-height: 1.6;
    color: #cbd5e1;
    white-space: pre-wrap;
  }
  .loading {
    text-align: center;
    color: #94a3b8;
    padding: 40px 0;
  }
  .progress {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 8px;
    text-align: right;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🛡️ 支援士クエスト</h1>

  <div id="authForm">
    <input type="email" id="email" placeholder="メールアドレス">
    <input type="password" id="password" placeholder="パスワード(6文字以上)">
    <button onclick="signUp()">新規登録</button>
    <button class="secondary" onclick="signIn()">ログイン</button>
    <div id="message"></div>
  </div>

  <div id="quizArea">
    <div class="top-bar">
      <span id="userLabel"></span>
      <button onclick="signOut()">ログアウト</button>
    </div>
    <div id="quizContent"><div class="loading">問題を読み込み中...</div></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gmtfzlfxswzkwqxnldpw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MjnrZuoAiuyTy5uu1f1tpg_zcgdHLEJ";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const fieldNames = {
    crypto: "暗号技術",
    auth: "認証・アクセス制御",
    network: "ネットワークセキュリティ",
    webapp: "Webアプリセキュリティ",
    malware: "マルウェア対策",
    vuln: "脆弱性管理",
    secure_coding: "セキュアプログラミング",
    incident: "インシデント対応・フォレンジック",
    management: "セキュリティマネジメント",
    law: "法律・規格・倫理",
    cloud: "クラウド・ゼロトラスト"
  };

  let questions = [];
  let currentIndex = 0;
  let answered = false;
  let currentUser = null;

  function showMessage(text) {
    document.getElementById('message').innerText = text;
  }

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) {
      showMessage("登録エラー: " + error.message);
    } else {
      showMessage("登録成功!そのままログインしてください。");
    }
  }

  async function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showMessage("ログインエラー: " + error.message);
    } else {
      checkUser();
    }
  }

  async function signOut() {
    await sb.auth.signOut();
    checkUser();
  }

  async function checkUser() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      currentUser = user;
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('quizArea').style.display = 'block';
      document.getElementById('userLabel').innerText = user.email;
      await loadQuestions();
    } else {
      currentUser = null;
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('quizArea').style.display = 'none';
      showMessage("");
    }
  }

  async function loadQuestions() {
    const container = document.getElementById('quizContent');
    container.innerHTML = '<div class="loading">問題を読み込み中...</div>';

    const { data, error } = await sb.from('questions').select('*');

    if (error) {
      container.innerHTML = '<div class="loading">問題の読み込みに失敗しました: ' + error.message + '</div>';
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="loading">問題が登録されていません。</div>';
      return;
    }

    // ランダムに並び替え
    questions = data.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = questions[currentIndex];
    const container = document.getElementById('quizContent');

    const fieldLabel = (q.field_tags && q.field_tags.length > 0)
      ? (fieldNames[q.field_tags[0]] || q.field_tags[0])
      : "分野未設定";

    let choicesHtml = "";
    for (const key in q.choices) {
      choicesHtml += `<button class="choice" onclick="selectChoice('${key}')" id="choice-${key}">${key}. ${q.choices[key]}</button>`;
    }

    container.innerHTML = `
      <div class="progress">${currentIndex + 1} / ${questions.length} 問</div>
      <div class="tag">${fieldLabel}</div>
      <div class="question-body">${q.body}</div>
      <div id="choicesArea">${choicesHtml}</div>
      <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle"></div>
        <div class="exp-gain" id="expGain"></div>
        <div class="explanation" id="explanationText"></div>
        <button onclick="nextQuestion()" style="margin-top:16px;">次の問題へ</button>
      </div>
    `;
  }

  function selectChoice(key) {
    if (answered) return;
    answered = true;

    const q = questions[currentIndex];
    const isCorrect = (key === q.official_answer);

    for (const k in q.choices) {
      const btn = document.getElementById('choice-' + k);
      btn.disabled = true;
      if (k === q.official_answer) {
        btn.classList.add('correct');
      } else if (k === key) {
        btn.classList.add('incorrect');
      }
    }

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const expGain = document.getElementById('expGain');
    const explanationText = document.getElementById('explanationText');

    if (isCorrect) {
      resultTitle.innerText = "✅ 正解!";
      resultTitle.className = "result-title correct-text";
      expGain.innerText = "+10 EXP";
    } else {
      resultTitle.innerText = "❌ 不正解";
      resultTitle.className = "result-title incorrect-text";
      expGain.innerText = "+2 EXP(正解は " + q.official_answer + ")";
    }

    explanationText.innerText = q.explanation;
    resultBox.style.display = "block";
  }

  function nextQuestion() {
    currentIndex = (currentIndex + 1) % questions.length;
    renderQuestion();
  }

  checkUser();
</script>

</body>
</html>
