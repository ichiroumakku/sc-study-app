<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援士クエスト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 24px 0;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    padding: 28px;
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    box-sizing: border-box;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #0f172a;
    font-weight: bold;
    font-size: 16px;
    margin-top: 8px;
  }
  button.secondary {
    background: transparent;
    border: 1px solid #22c55e;
    color: #22c55e;
  }
  #message {
    margin-top: 16px;
    text-align: center;
    font-size: 14px;
    color: #fbbf24;
  }
  #quizArea {
    display: none;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    color: #94a3b8;
  }
  .top-bar button {
    width: auto;
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 0;
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
  }
  .tag {
    display: inline-block;
    background: #334155;
    color: #93c5fd;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    margin-bottom: 12px;
  }
  .question-body {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    box-sizing: border-box;
  }
  .choice.correct {
    border-color: #22c55e;
    background: #14532d;
    font-weight: bold;
  }
  .choice.incorrect {
    border-color: #ef4444;
    background: #450a0a;
  }
  .result-box {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: 10px;
    background: #0f172a;
  }
  .result-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .result-title.correct-text { color: #4ade80; }
  .result-title.incorrect-text { color: #f87171; }
  .exp-gain {
    font-size: 13px;
    color: #fbbf24;
    margin-bottom: 4px;
  }
  .level-up {
    font-size: 14px;
    color: #facc15;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .explanation {
    font-size: 13px;
    line-height: 1.6;
    color: #cbd5e1;
    white-space: pre-wrap;
  }
  .loading {
    text-align: center;
    color: #94a3b8;
    padding: 40px 0;
  }
  .progress {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 8px;
    text-align: right;
  }
  .deepdive {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #334155;
  }
  .deepdive-title {
    font-size: 14px;
    font-weight: bold;
    color: #93c5fd;
    margin-bottom: 12px;
  }
  .deepdive-history {
    margin-bottom: 14px;
  }
  .deepdive-empty {
    font-size: 12px;
    color: #64748b;
    padding: 4px 0;
  }
  .dd-msg {
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .dd-user {
    background: #1e293b;
    border: 1px solid #334155;
  }
  .dd-assistant {
    background: #0f172a;
    border: 1px solid #334155;
  }
  .dd-role {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .dd-content {
    white-space: pre-wrap;
    color: #e2e8f0;
  }
  .deepdive-label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .deepdive-textarea {
    width: 100%;
    min-height: 70px;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    box-sizing: border-box;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .deepdive-btn {
    width: 100%;
    padding: 10px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: transparent;
    color: #e2e8f0;
    font-size: 13px;
    font-weight: bold;
    margin: 0 0 10px;
  }
  .deepdive-btn.save {
    background: #22c55e;
    color: #0f172a;
    border-color: #22c55e;
  }
  .deepdive-links {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .deepdive-link {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #6366f1;
    color: #a5b4fc;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
  }
  .deepdive-msg {
    font-size: 12px;
    text-align: center;
    min-height: 16px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🛡️ 支援士クエスト</h1>

  <div id="authForm">
    <input type="email" id="email" placeholder="メールアドレス">
    <input type="password" id="password" placeholder="パスワード(6文字以上)">
    <button onclick="signUp()">新規登録</button>
    <button class="secondary" onclick="signIn()">ログイン</button>
    <div id="message"></div>
  </div>

  <div id="quizArea">
    <div class="top-bar">
      <span id="userLabel"></span>
      <button onclick="signOut()">ログアウト</button>
    </div>
    <div id="quizContent"><div class="loading">問題を読み込み中...</div></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gmtfzlfxswzkwqxnldpw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MjnrZuoAiuyTy5uu1f1tpg_zcgdHLEJ";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const fieldNames = {
    crypto: "暗号技術",
    auth: "認証・アクセス制御",
    network: "ネットワークセキュリティ",
    webapp: "Webアプリセキュリティ",
    malware: "マルウェア対策",
    vuln: "脆弱性管理",
    secure_coding: "セキュアプログラミング",
    incident: "インシデント対応・フォレンジック",
    management: "セキュリティマネジメント",
    law: "法律・規格・倫理",
    cloud: "クラウド・ゼロトラスト"
  };

  // 難易度別EXPテーブル
  const expTable = {
    1: { correct: 5,  incorrect: 1 },
    2: { correct: 8,  incorrect: 1 },
    3: { correct: 10, incorrect: 2 },
    4: { correct: 15, incorrect: 3 },
    5: { correct: 20, incorrect: 4 }
  };

  let questions = [];
  let currentIndex = 0;
  let answered = false;
  let currentUser = null;

  function showMessage(text) {
    document.getElementById('message').innerText = text;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) {
      showMessage("登録エラー: " + error.message);
    } else {
      showMessage("登録成功!そのままログインしてください。");
    }
  }

  async function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showMessage("ログインエラー: " + error.message);
    } else {
      checkUser();
    }
  }

  async function signOut() {
    await sb.auth.signOut();
    checkUser();
  }

  async function checkUser() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      currentUser = user;
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('quizArea').style.display = 'block';
      document.getElementById('userLabel').innerText = user.email;
      await loadQuestions();
    } else {
      currentUser = null;
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('quizArea').style.display = 'none';
      showMessage("");
    }
  }

  async function loadQuestions() {
    const container = document.getElementById('quizContent');
    container.innerHTML = '<div class="loading">問題を読み込み中...</div>';

    const { data, error } = await sb.from('questions').select('*');

    if (error) {
      container.innerHTML = '<div class="loading">問題の読み込みに失敗しました: ' + error.message + '</div>';
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="loading">問題が登録されていません。</div>';
      return;
    }

    questions = data.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = questions[currentIndex];
    const container = document.getElementById('quizContent');

    const fieldLabel = (q.field_tags && q.field_tags.length > 0)
      ? (fieldNames[q.field_tags[0]] || q.field_tags[0])
      : "分野未設定";

    let choicesHtml = "";
    for (const key in q.choices) {
      choicesHtml += `<button class="choice" onclick="selectChoice('${key}')" id="choice-${key}">${key}. ${q.choices[key]}</button>`;
    }

    container.innerHTML = `
      <div class="progress">${currentIndex + 1} / ${questions.length} 問</div>
      <div class="tag">${fieldLabel}</div>
      <div class="question-body">${q.body}</div>
      <div id="choicesArea">${choicesHtml}</div>
      <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle"></div>
        <div class="level-up" id="levelUpText" style="display:none;"></div>
        <div class="exp-gain" id="expGain"></div>
        <div class="explanation" id="explanationText"></div>
        <div id="deepDiveArea"></div>
        <button onclick="nextQuestion()" style="margin-top:16px;">次の問題へ</button>
      </div>
    `;
  }

  // レベル計算:累計EXPから現在のレベルを算出
  // レベルN→N+1に必要なEXP = N * 100 (累積)
  function calcLevel(totalExp) {
    let level = 1;
    let remaining = totalExp;
    while (remaining >= level * 100) {
      remaining -= level * 100;
      level++;
    }
    return level;
  }

  async function selectChoice(key) {
    if (answered) return;
    answered = true;

    const q = questions[currentIndex];
    const isCorrect = (key === q.official_answer);
    const difficulty = q.difficulty || 3;
    const expInfo = expTable[difficulty] || expTable[3];
    const expGained = isCorrect ? expInfo.correct : expInfo.incorrect;

    for (const k in q.choices) {
      const btn = document.getElementById('choice-' + k);
      btn.disabled = true;
      if (k === q.official_answer) {
        btn.classList.add('correct');
      } else if (k === key) {
        btn.classList.add('incorrect');
      }
    }

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const expGain = document.getElementById('expGain');
    const explanationText = document.getElementById('explanationText');
    const levelUpText = document.getElementById('levelUpText');

    if (isCorrect) {
      resultTitle.innerText = "✅ 正解!";
      resultTitle.className = "result-title correct-text";
    } else {
      resultTitle.innerText = "❌ 不正解";
      resultTitle.className = "result-title incorrect-text";
    }
    expGain.innerText = "+" + expGained + " EXP (難易度" + difficulty + ")";
    explanationText.innerText = q.explanation;
    resultBox.style.display = "block";
    renderDeepDive(q);

    // ---- ここからSupabaseへの記録処理 ----
    try {
      // 1. answer_logs に記録
      await sb.from('answer_logs').insert({
        user_id: currentUser.id,
        question_id: q.id,
        user_answer: key,
        is_correct: isCorrect,
        exp_gained: expGained
      });

      // 2. 対象分野ごとに field_status を更新
      const tags = (q.field_tags && q.field_tags.length > 0) ? q.field_tags : ['management'];

      for (const fieldId of tags) {
        const { data: existing } = await sb
          .from('field_status')
          .select('*')
          .eq('user_id', currentUser.id)
          .eq('field_id', fieldId)
          .maybeSingle();

        const prevExp = existing ? existing.exp : 0;
        const newExp = prevExp + expGained;
        const prevLevel = existing ? existing.level : 1;
        const newLevel = calcLevel(newExp);

        await sb.from('field_status').upsert({
          user_id: currentUser.id,
          field_id: fieldId,
          exp: newExp,
          level: newLevel,
          updated_at: new Date().toISOString()
        });

        if (newLevel > prevLevel) {
          levelUpText.innerText = "🎉 " + (fieldNames[fieldId] || fieldId) + " が Lv." + newLevel + " にレベルアップ!";
          levelUpText.style.display = "block";
        }
      }
    } catch (e) {
      console.error("記録エラー:", e);
    }
    // ---- ここまで ----
  }

  // ---- 解説の深掘り学習 ----
  function buildPrompt(q, doubt) {
    let choicesText = "";
    for (const key in q.choices) {
      choicesText += key + ". " + q.choices[key] + "\n";
    }
    return (
      "情報処理安全確保支援士試験の問題です。公式解説の内容で分からない点があります。\n\n" +
      "【問題】\n" + q.body + "\n\n" +
      "【選択肢】\n" + choicesText + "\n" +
      "【正解】" + q.official_answer + "\n\n" +
      "【公式解説】\n" + (q.explanation || "") + "\n\n" +
      "【私の疑問】\n" + doubt + "\n\n" +
      "初学者にも分かるように、私の疑問に答えてください。"
    );
  }

  function showDeepDiveMsg(text, isError) {
    const el = document.getElementById('deepDiveMsg');
    if (!el) return;
    el.innerText = text;
    el.style.color = isError ? '#f87171' : '#4ade80';
  }

  function renderDeepDive(q) {
    const area = document.getElementById('deepDiveArea');
    if (!area) return;
    area.innerHTML = `
      <div class="deepdive">
        <div class="deepdive-title">🔍 この解説を深掘りする</div>
        <div id="deepDiveHistory" class="deepdive-history"><div class="deepdive-empty">読み込み中...</div></div>
        <label class="deepdive-label" for="doubtInput">疑問を入力</label>
        <textarea id="doubtInput" class="deepdive-textarea" placeholder="例: なぜアは不正解なのか?"></textarea>
        <button class="deepdive-btn" onclick="copyPrompt()">📋 プロンプトをコピー</button>
        <div class="deepdive-links">
          <a class="deepdive-link" href="https://claude.ai/new" target="_blank" rel="noopener">Claude.aiを開く</a>
          <a class="deepdive-link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPTを開く</a>
        </div>
        <label class="deepdive-label" for="answerInput">AIの回答を貼り付け</label>
        <textarea id="answerInput" class="deepdive-textarea" placeholder="コピペ先で得た回答をここに貼り付け"></textarea>
        <button class="deepdive-btn save" onclick="saveDeepDive()">💾 保存する</button>
        <div id="deepDiveMsg" class="deepdive-msg"></div>
      </div>
    `;
    loadDeepDiveHistory(q.id);
  }

  async function loadDeepDiveHistory(questionId) {
    const box = document.getElementById('deepDiveHistory');
    if (!box) return;
    const { data, error } = await sb
      .from('chat_messages')
      .select('*')
      .eq('question_id', questionId)
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });

    if (error) {
      box.innerHTML = '<div class="deepdive-empty">履歴の読み込みに失敗しました</div>';
      return;
    }
    if (!data || data.length === 0) {
      box.innerHTML = '<div class="deepdive-empty">まだやり取りはありません</div>';
      return;
    }
    let html = "";
    for (const m of data) {
      const isUser = (m.role === 'user');
      html +=
        '<div class="dd-msg ' + (isUser ? 'dd-user' : 'dd-assistant') + '">' +
          '<div class="dd-role">' + (isUser ? '❓ 疑問' : '💡 回答') + '</div>' +
          '<div class="dd-content">' + escapeHtml(m.content) + '</div>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  async function copyPrompt() {
    const q = questions[currentIndex];
    const doubt = (document.getElementById('doubtInput').value || '').trim();
    if (!doubt) {
      showDeepDiveMsg('先に疑問を入力してください', true);
      return;
    }
    const text = buildPrompt(q, doubt);
    try {
      await navigator.clipboard.writeText(text);
      showDeepDiveMsg('コピーしました。Claude.aiまたはChatGPTに貼り付けてください', false);
      return;
    } catch (e) {
      // フォールバック(古いSafari / 非セキュアコンテキスト)
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      showDeepDiveMsg(ok ? 'コピーしました' : 'コピーに失敗しました。手動で選択してコピーしてください', !ok);
    }
  }

  async function saveDeepDive() {
    const q = questions[currentIndex];
    const doubt = (document.getElementById('doubtInput').value || '').trim();
    const answer = (document.getElementById('answerInput').value || '').trim();
    if (!doubt || !answer) {
      showDeepDiveMsg('疑問と回答の両方を入力してください', true);
      return;
    }
    const now = Date.now();
    const { error } = await sb.from('chat_messages').insert([
      { user_id: currentUser.id, question_id: q.id, role: 'user', content: doubt, created_at: new Date(now).toISOString() },
      { user_id: currentUser.id, question_id: q.id, role: 'assistant', content: answer, created_at: new Date(now + 1).toISOString() }
    ]);
    if (error) {
      showDeepDiveMsg('保存に失敗しました: ' + error.message, true);
      return;
    }
    document.getElementById('doubtInput').value = '';
    document.getElementById('answerInput').value = '';
    showDeepDiveMsg('保存しました', false);
    loadDeepDiveHistory(q.id);
  }
  // ---- ここまで ----

  function nextQuestion() {
    currentIndex = (currentIndex + 1) % questions.length;
    renderQuestion();
  }

  checkUser();
</script>

</body>
</html>
